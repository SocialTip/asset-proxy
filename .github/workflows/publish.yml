# Creates git tags for the current package versions and pushes them. Triggered manually after a release PR has been merged. For each publishable package, creates a tag in the format <package-name>@<version>. If a tag already exists at a different commit, the workflow fails — run the Prepare Release workflow first to bump versions. Pushing the tags automatically triggers release.yml to publish to npm. See docs/Release.md for the full process.

name: Publish

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/publish.yml

jobs:
  tag-and-push:
    runs-on: warp-ubuntu-latest-x64-2x
    permissions:
      contents: write
      checks: read
      actions: read
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Wait for CI to pass on HEAD
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(git rev-parse HEAD)
          RUN_ID=$(gh run list --commit "$SHA" --workflow cicd.yml --json databaseId --jq '.[0].databaseId')
          if [ -z "$RUN_ID" ]; then
            echo "::error::No CI run found for ${SHA}."
            exit 1
          fi
          gh run watch "$RUN_ID" --exit-status

      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions

      - name: Debug — list existing tags
        run: git tag -l

      - name: Create tags for current versions
        run: |
          TAGGED=""

          for PKG_DIR in packages/*/; do
            PKG_DIR="${PKG_DIR%/}"
            pkg=$(basename "$PKG_DIR")

            # Skip private packages
            PRIVATE=$(node -p "require('./$PKG_DIR/package.json').private || false")
            if [ "$PRIVATE" = "true" ]; then
              echo "Skipping private package: $pkg"
              continue
            fi

            PKG_NAME=$(node -p "require('./$PKG_DIR/package.json').name")
            VERSION=$(node -p "require('./$PKG_DIR/package.json').version")
            TAG="${PKG_NAME}@${VERSION}"

            if git tag -l "$TAG" | grep -q .; then
              echo "::notice::${TAG} already exists, skipping"
              continue
            fi

            git tag "$TAG"
            TAGGED="${TAGGED} ${TAG}"
            echo "::notice::Tagged ${TAG}"
          done

          if [ -z "$(echo "$TAGGED" | xargs)" ]; then
            echo "::notice::No new tags to push — all versions are already tagged."
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "::notice::Dry run — would push tags:${TAGGED}"
          else
            for TAG in $TAGGED; do
              git push origin "$TAG"
            done
          fi
