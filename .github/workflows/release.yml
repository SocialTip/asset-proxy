# Publishes a package to npm when a version tag is pushed. Triggered automatically by tag pushes matching @socialtip/asset-proxy-*@*. Detects which package the tag belongs to, verifies the version matches package.json, builds the package, and publishes. Tags are created by the Publish workflow (publish.yml). See docs/Release.md for the full process.

name: Release
run-name: "Release: ${{ github.ref_name }}"

on:
  push:
    tags:
      - "@socialtip/asset-proxy-*@*"

jobs:
  release:
    name: "Release package: ${{ github.ref_name }}"
    runs-on: warp-ubuntu-latest-x64-2x
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Detect package from tag
        id: detect
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # Tag format: @socialtip/asset-proxy-<name>@<version>
          PKG_NAME=$(echo "$TAG" | sed 's/@[^@]*$//')
          VERSION=$(echo "$TAG" | sed 's/.*@//')
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "package=${PKG_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Verify version matches
        run: |
          ACTUAL=$(pnpm ls --filter ${{ steps.detect.outputs.package }} --json --depth -1 | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'))[0].version")
          if [ "$ACTUAL" != "${{ steps.detect.outputs.version }}" ]; then
            echo "::error::Tag version ${{ steps.detect.outputs.version }} does not match package.json version ${ACTUAL}"
            exit 1
          fi

      - run: pnpm -w run build

      - name: Publish to npm
        run: pnpm --filter ${{ steps.detect.outputs.package }} publish --access public --no-git-checks --provenance

      - run: echo "::notice::Published ${{ steps.detect.outputs.tag }}"
