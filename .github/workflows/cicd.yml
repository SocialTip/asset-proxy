# Continuous integration and deployment. The test job runs typecheck, lint, build, and tests for the proxy and url-parser packages. The build job typechecks and builds the url-generator package. CD pushes a Docker image to GHCR on push to main after a successful test job. The required job gates test and build for branch protection.

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: cicd-${{ github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    permissions:
      contents: write
      pull-requests: write
    runs-on: warp-ubuntu-latest-x64-2x
    services:
      file-server:
        image: nginx:alpine
        ports:
          - 80:80
        volumes:
          - /tmp/nginx:/usr/share/nginx
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Check for relevant changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            relevant:
              - '.github/workflows/cicd.yml'
              - '.github/workflows/cd.yml'
              - 'Dockerfile'
              - 'packages/url-parser/**'
              - 'packages/proxy/**'

      - name: Map file-server hostname
        if: github.event_name == 'push' || steps.changes.outputs.relevant == 'true'
        run: echo "127.0.0.1 file-server" | sudo tee -a /etc/hosts

      - name: Copy test fixtures into nginx
        if: github.event_name == 'push' || steps.changes.outputs.relevant == 'true'
        run: sudo cp -a packages/proxy/tests/fixtures/. /tmp/nginx/html/

      - name: Configure nginx to serve all files
        if: github.event_name == 'push' || steps.changes.outputs.relevant == 'true'
        run: |
          CONTAINER_ID=$(docker ps -qf "ancestor=nginx:alpine")
          docker exec "$CONTAINER_ID" sh -c 'cat > /etc/nginx/conf.d/default.conf << EOF
          server {
            listen 80;
            location / {
              root /usr/share/nginx/html;
              autoindex on;
            }
          }
          EOF'
          docker exec "$CONTAINER_ID" nginx -s reload

      - name: Verify file-server
        if: github.event_name == 'push' || steps.changes.outputs.relevant == 'true'
        run: curl -sf http://file-server/test-image.png -o /dev/null

      - uses: actions/setup-node@v4
        if: github.event_name == 'push' || steps.changes.outputs.relevant == 'true'
        with:
          node-version-file: .tool-versions
          cache: yarn

      - name: Install dependencies
        if: github.event_name == 'push' || steps.changes.outputs.relevant == 'true'
        run: yarn install --immutable

      - name: Typecheck
        if: github.event_name == 'push' || steps.changes.outputs.relevant == 'true'
        run: yarn typecheck

      - name: Lint
        if: github.event_name == 'push' || steps.changes.outputs.relevant == 'true'
        run: yarn lint

      - name: Build packages
        if: github.event_name == 'push' || steps.changes.outputs.relevant == 'true'
        run: yarn build

      - name: Install ffmpeg, exiftool, and heif-thumbnailer
        if: github.event_name == 'push' || steps.changes.outputs.relevant == 'true'
        env:
          FFMPEG_VERSION: "7.0"
          FFMPEG_RELEASE: "autobuild-2024-08-31-12-50"
          FFMPEG_BUILD: "n7.0.2-6-g7e69129d2f"
        run: |
          curl -fsSL https://github.com/BtbN/FFmpeg-Builds/releases/download/${FFMPEG_RELEASE}/ffmpeg-${FFMPEG_BUILD}-linux64-gpl-${FFMPEG_VERSION}.tar.xz \
            | sudo tar -xJ --strip-components=1 -C /usr/local
          sudo apt-get update -qq && sudo apt-get install -y -qq libimage-exiftool-perl heif-thumbnailer

      - name: Start asset-proxy
        if: github.event_name == 'push' || steps.changes.outputs.relevant == 'true'
        run: nohup npx tsx packages/proxy/src/index.ts > /tmp/asset-proxy.log 2>&1 &
        env:
          SKIP_GPU: "1"
          SOURCE_URL_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          ALLOWED_ORIGINS: "http://file-server"

      - name: Wait for asset-proxy
        if: github.event_name == 'push' || steps.changes.outputs.relevant == 'true'
        run: timeout 30 bash -c 'until curl -sf http://localhost:8080/health; do sleep 1; done'

      - name: Test
        if: github.event_name == 'push' || steps.changes.outputs.relevant == 'true'
        run: yarn test --coverage

      - name: Update snapshots
        if: failure()
        run: yarn test --update

      - name: Check for snapshot changes
        if: always() && github.event_name == 'pull_request'
        id: snapshots
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create snapshot update PR
        if: always() && steps.snapshots.outputs.changed == 'true' && github.event_name == 'pull_request'
        id: snapshot-pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="snapshot-update/${{ github.head_ref || github.ref_name }}"
          BASE="${{ github.head_ref || github.ref_name }}"
          git fetch origin "$BRANCH" || true
          git checkout -B "$BRANCH"
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "test: update image snapshots"
          git lfs push --all origin "$BRANCH"
          git push --force-with-lease origin "$BRANCH"
          if ! gh pr view "$BRANCH" --json number &>/dev/null; then
            gh api repos/${{ github.repository }}/pulls \
              -f head="$BRANCH" \
              -f base="$BASE" \
              -f title="Update image snapshots" \
              -f body="Automated snapshot update from [${{ github.workflow }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}?pr=${{ github.event.pull_request.number }})
          Created from #${{ github.event.pull_request.number }}"
          fi
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Delete stale snapshot branch
        if: always() && steps.snapshots.outputs.changed != 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="snapshot-update/${{ github.head_ref || github.ref_name }}"
          gh pr close "$BRANCH" --delete-branch 2>/dev/null || true

      - name: Fail if snapshots were outdated
        if: steps.snapshot-pr.outputs.created == 'true'
        run: exit 1

      - uses: codecov/codecov-action@v5
        if: always()
        with:
          files: coverage/clover.xml
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Print asset-proxy logs
        if: failure() && steps.snapshots.outputs.changed != 'true'
        run: cat /tmp/asset-proxy.log

  build:
    runs-on: warp-ubuntu-latest-x64-2x
    steps:
      - uses: actions/checkout@v4

      - name: Check for relevant changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            relevant:
              - '.github/workflows/cicd.yml'
              - 'packages/url-generator/**'

      - uses: actions/setup-node@v4
        if: github.event_name == 'push' || steps.changes.outputs.relevant == 'true'
        with:
          node-version-file: .tool-versions
          cache: yarn

      - name: Install dependencies
        if: github.event_name == 'push' || steps.changes.outputs.relevant == 'true'
        run: yarn install --immutable

      - name: Typecheck
        if: github.event_name == 'push' || steps.changes.outputs.relevant == 'true'
        run: yarn typecheck

      - name: Build
        if: github.event_name == 'push' || steps.changes.outputs.relevant == 'true'
        run: yarn build

  cd:
    if: github.event_name == 'push'
    needs: [test]
    uses: ./.github/workflows/cd.yml
    permissions:
      contents: read
      packages: write

  required:
    if: always()
    needs: [test, build, cd]
    runs-on: warp-ubuntu-latest-x64-2x
    steps:
      - name: Check required jobs
        run: |
          for job in test build cd; do
            result="${{ needs[job].result }}"
          done
          if [ "${{ needs.test.result }}" != "success" ] && [ "${{ needs.test.result }}" != "skipped" ]; then
            echo "test: ${{ needs.test.result }}"
            exit 1
          fi
          if [ "${{ needs.build.result }}" != "success" ] && [ "${{ needs.build.result }}" != "skipped" ]; then
            echo "build: ${{ needs.build.result }}"
            exit 1
          fi
          if [ "${{ needs.cd.result }}" != "success" ] && [ "${{ needs.cd.result }}" != "skipped" ]; then
            echo "cd: ${{ needs.cd.result }}"
            exit 1
          fi
