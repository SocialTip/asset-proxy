name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: cicd-${{ github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    permissions:
      contents: write
      pull-requests: write
    runs-on: warp-ubuntu-latest-x64-2x
    services:
      file-server:
        image: nginx:alpine
        ports:
          - 80:80
        volumes:
          - /tmp/nginx:/usr/share/nginx
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Map file-server hostname
        run: echo "127.0.0.1 file-server" | sudo tee -a /etc/hosts

      - name: Copy test fixtures into nginx
        run: sudo cp -a tests/fixtures/. /tmp/nginx/html/

      - name: Configure nginx to serve all files
        run: |
          CONTAINER_ID=$(docker ps -qf "ancestor=nginx:alpine")
          docker exec "$CONTAINER_ID" sh -c 'cat > /etc/nginx/conf.d/default.conf << EOF
          server {
            listen 80;
            location / {
              root /usr/share/nginx/html;
              autoindex on;
            }
          }
          EOF'
          docker exec "$CONTAINER_ID" nginx -s reload

      - name: Verify file-server
        run: curl -sf http://file-server/test-image.png -o /dev/null

      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: yarn

      - run: yarn install --immutable

      - run: yarn typecheck

      - run: yarn lint

      - name: Install ffmpeg, exiftool, and heif-thumbnailer
        env:
          FFMPEG_VERSION: "7.0"
          FFMPEG_RELEASE: "autobuild-2024-08-31-12-50"
          FFMPEG_BUILD: "n7.0.2-6-g7e69129d2f"
        run: |
          curl -fsSL https://github.com/BtbN/FFmpeg-Builds/releases/download/${FFMPEG_RELEASE}/ffmpeg-${FFMPEG_BUILD}-linux64-gpl-${FFMPEG_VERSION}.tar.xz \
            | sudo tar -xJ --strip-components=1 -C /usr/local
          sudo apt-get update -qq && sudo apt-get install -y -qq libimage-exiftool-perl heif-thumbnailer

      - name: Start asset-proxy
        run: nohup npx tsx src/index.ts > /tmp/asset-proxy.log 2>&1 &
        env:
          SKIP_GPU: "1"
          SOURCE_URL_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          ALLOWED_ORIGINS: "http://file-server"

      - name: Wait for asset-proxy
        run: timeout 30 bash -c 'until curl -sf http://localhost:8080/health; do sleep 1; done'

      - run: yarn test --coverage --update

      - name: Check for snapshot changes
        if: always() && github.event_name == 'pull_request'
        id: snapshots
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create snapshot update PR
        if: always() && steps.snapshots.outputs.changed == 'true' && github.event_name == 'pull_request'
        id: snapshot-pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="snapshot-update/${{ github.head_ref || github.ref_name }}"
          BASE="${{ github.head_ref || github.ref_name }}"
          git fetch origin "$BRANCH" || true
          git checkout -B "$BRANCH"
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "test: update image snapshots"
          git lfs push --all origin "$BRANCH"
          git push --force-with-lease origin "$BRANCH"
          if ! gh pr view "$BRANCH" --json number &>/dev/null; then
            gh api repos/${{ github.repository }}/pulls \
              -f head="$BRANCH" \
              -f base="$BASE" \
              -f title="Update image snapshots" \
              -f body="Automated snapshot update from [${{ github.workflow }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}?pr=${{ github.event.pull_request.number }})
          Created from #${{ github.event.pull_request.number }}"
          fi
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Delete stale snapshot branch
        if: always() && steps.snapshots.outputs.changed != 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="snapshot-update/${{ github.head_ref || github.ref_name }}"
          gh pr close "$BRANCH" --delete-branch 2>/dev/null || true

      - name: Fail if snapshots were outdated
        if: steps.snapshot-pr.outputs.created == 'true'
        run: exit 1

      - uses: codecov/codecov-action@v5
        if: always()
        with:
          files: repo/coverage/cobertura-coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Print asset-proxy logs
        if: failure() && steps.snapshots.outputs.changed != 'true'
        run: cat /tmp/asset-proxy.log

  cd-changes:
    if: github.event_name == 'pull_request'
    runs-on: warp-ubuntu-latest-x64-2x
    permissions:
      contents: read
      pull-requests: read
    outputs:
      changed: ${{ steps.filter.outputs.cd }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            cd:
              - '.github/workflows/cd.yml'

  cd:
    if: |
      always() && needs.ci.result == 'success' &&
      (github.event_name == 'push' || needs.cd-changes.outputs.changed == 'true')
    needs: [ci, cd-changes]
    uses: ./.github/workflows/cd.yml
    permissions:
      contents: read
      packages: write
