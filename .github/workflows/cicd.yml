# Continuous integration and deployment. The test job runs typecheck, lint, build, and tests across all packages. CD builds a Docker image and pushes it to GHCR on push to main. The required job gates all jobs for branch protection.

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: cicd-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    env:
      BEST_FORMAT_MAX_RESOLUTION: "0.005"
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm -r run build

      - run: pnpm -w run typecheck

      - run: pnpm -w run lint

      - name: Prepare coverage mounts
        run: mkdir -p .coverage-docker/asset-proxy .coverage-docker/cache-proxy

      - uses: docker/setup-buildx-action@v3

      - name: Build proxy image with GHA cache
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: |
            asset-proxy-asset-proxy:latest
            asset-proxy-cache-proxy:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start docker compose stack
        id: stack
        env:
          NODE_V8_COVERAGE: /coverage
        run: docker compose up -d --wait

      - name: Print docker logs if stack failed
        if: failure() && steps.stack.outcome == 'failure'
        run: docker compose logs

      - name: Run tests
        id: tests
        run: pnpm -w run test --coverage

      - name: Update snapshots
        if: failure() && steps.tests.outcome == 'failure'
        run: pnpm -w run test --update

      - name: Collect and merge coverage
        if: always() && steps.tests.outcome != 'skipped'
        run: |
          # Stop proxy containers so Node flushes NODE_V8_COVERAGE data
          # to the mounted .coverage-docker dirs
          docker compose stop asset-proxy cache-proxy

          # Save vitest lcov before merge overwrites it
          mkdir -p .coverage-raw/server
          cp coverage/lcov.info .coverage-raw/vitest-lcov.info

          # Collect raw V8 coverage from both proxy containers (files
          # owned by the container's root user, hence the chown)
          sudo chown -R "$(id -u):$(id -g)" .coverage-docker || true
          cp .coverage-docker/asset-proxy/*.json .coverage-raw/server/ 2>/dev/null || true
          cp .coverage-docker/cache-proxy/*.json .coverage-raw/server/ 2>/dev/null || true

          # Convert server V8 data to lcov via c8 (server uses tsx with
          # --conditions source, so V8 data has src/ URLs)
          if compgen -G ".coverage-raw/server/*.json" > /dev/null; then
            pnpm exec c8 report \
              --src . \
              --include 'packages/*/src/**' \
              --exclude '**/__mocks__/**' \
              --temp-directory .coverage-raw/server \
              --reporter lcov --reports-dir .coverage-server-report
          fi

          # Merge vitest + server lcov (max count per line, regenerates HTML)
          node scripts/merge-coverage.mjs \
            .coverage-raw/vitest-lcov.info \
            .coverage-server-report/lcov.info

      - name: Check for snapshot changes
        if: always() && github.event_name == 'pull_request'
        id: snapshots
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create snapshot update PR
        if: always() && steps.snapshots.outputs.changed == 'true' && github.event_name == 'pull_request'
        id: snapshot-pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="snapshot-update/${{ github.head_ref || github.ref_name }}"
          BASE="${{ github.head_ref || github.ref_name }}"
          git fetch origin "$BRANCH" || true
          git checkout -B "$BRANCH"
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "test: update image snapshots"
          git lfs push --all origin "$BRANCH"
          git push --force-with-lease origin "$BRANCH"
          if ! gh pr view "$BRANCH" --json number &>/dev/null; then
            gh api repos/${{ github.repository }}/pulls \
              -f head="$BRANCH" \
              -f base="$BASE" \
              -f title="Update image snapshots" \
              -f body="Automated snapshot update from [${{ github.workflow }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}?pr=${{ github.event.pull_request.number }})
          Created from #${{ github.event.pull_request.number }}"
          fi
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Delete stale snapshot branch
        if: always() && !cancelled() && steps.snapshots.outputs.changed != 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="snapshot-update/${{ github.head_ref || github.ref_name }}"
          gh pr close "$BRANCH" --delete-branch 2>/dev/null || true

      - name: Fail if snapshots were outdated
        if: steps.snapshot-pr.outputs.created == 'true'
        run: exit 1

      - uses: codecov/codecov-action@v5
        if: always() && !cancelled() && steps.tests.outcome != 'skipped'
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Print proxy logs
        if: failure() && steps.snapshots.outputs.changed != 'true'
        run: |
          echo "=== asset-proxy ==="
          docker compose logs asset-proxy --tail 200 || true
          echo "=== cache-proxy ==="
          docker compose logs cache-proxy --tail 200 || true
          echo "=== jaeger services ==="
          curl -sf http://localhost:16686/api/services || echo "Jaeger query failed"
          echo "=== jaeger traces (asset-proxy) ==="
          curl -sf "http://localhost:16686/api/traces?service=asset-proxy&limit=1" | head -c 2000 || echo "No traces"
          echo "=== jaeger container logs ==="
          docker compose logs jaeger --tail 50 || true

  test-video-player:
    if: needs.changes.outputs.video-player == 'true'
    needs: [changes]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: packages/video-player
        run: pnpm exec playwright install --with-deps chromium

      - name: Run video-player browser tests
        run: pnpm --filter @socialtip/asset-proxy-video-player test

  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      video-player: ${{ steps.filter.outputs.video-player }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            video-player:
              - 'packages/video-player/**'

  docker-build:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/docker-build.yml
    with:
      push: false
    permissions:
      contents: read
      packages: write

  cd:
    if: github.event_name == 'push'
    needs: [test]
    uses: ./.github/workflows/docker-build.yml
    with:
      push: true
    permissions:
      contents: read
      packages: write

  required:
    if: always() && !cancelled()
    needs: [test, test-video-player, docker-build, cd]
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "test: ${{ needs.test.result }}"
            exit 1
          fi
          if [ "${{ needs.test-video-player.result }}" != "success" ] && [ "${{ needs.test-video-player.result }}" != "skipped" ]; then
            echo "test-video-player: ${{ needs.test-video-player.result }}"
            exit 1
          fi
          if [ "${{ needs.docker-build.result }}" != "success" ] && [ "${{ needs.docker-build.result }}" != "skipped" ]; then
            echo "docker-build: ${{ needs.docker-build.result }}"
            exit 1
          fi
          if [ "${{ needs.cd.result }}" != "success" ] && [ "${{ needs.cd.result }}" != "skipped" ]; then
            echo "cd: ${{ needs.cd.result }}"
            exit 1
          fi
