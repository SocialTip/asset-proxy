# Continuous integration and deployment. The test job runs typecheck, lint, build, and tests across all packages. CD builds a Docker image and pushes it to GHCR on push to main. The required job gates all jobs for branch protection.

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: cicd-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    permissions:
      contents: write
      pull-requests: write
    runs-on: warp-ubuntu-latest-x64-2x
    env:
      BEST_FORMAT_MAX_RESOLUTION: "0.005"
    services:
      file-server:
        image: nginx:alpine
        ports:
          - 80:80
        volumes:
          - /tmp/nginx:/usr/share/nginx
      jaeger:
        image: jaegertracing/all-in-one:latest
        ports:
          - 4318:4318
          - 16686:16686
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Map file-server hostname
        run: echo "127.0.0.1 file-server" | sudo tee -a /etc/hosts

      - name: Copy test fixtures into nginx
        run: sudo cp -a packages/proxy/tests/fixtures/. /tmp/nginx/html/

      - name: Configure nginx to serve all files
        run: |
          CONTAINER_ID=$(docker ps -qf "ancestor=nginx:alpine")
          docker exec "$CONTAINER_ID" sh -c 'cat > /etc/nginx/conf.d/default.conf << EOF
          server {
            listen 80;
            location / {
              root /usr/share/nginx/html;
              autoindex on;
            }
          }
          EOF'
          docker exec "$CONTAINER_ID" nginx -s reload

      - name: Verify file-server
        run: curl -sf http://file-server/test-image.png -o /dev/null

      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm -w run build

      - run: pnpm -w run typecheck

      - run: pnpm -w run lint

      - name: Install ffmpeg, exiftool, and heif-thumbnailer
        env:
          FFMPEG_VERSION: "7.0"
          FFMPEG_RELEASE: "autobuild-2024-08-31-12-50"
          FFMPEG_BUILD: "n7.0.2-6-g7e69129d2f"
        run: |
          curl -fsSL https://github.com/BtbN/FFmpeg-Builds/releases/download/${FFMPEG_RELEASE}/ffmpeg-${FFMPEG_BUILD}-linux64-gpl-${FFMPEG_VERSION}.tar.xz \
            | sudo tar -xJ --strip-components=1 -C /usr/local
          sudo apt-get update -qq && sudo apt-get install -y -qq libimage-exiftool-perl heif-thumbnailer

      - name: Start fake GCS server
        run: |
          docker run -d --name fake-gcs -p 4443:4443 fsouza/fake-gcs-server \
            -scheme http -port 4443 -data /data
          timeout 10 bash -c 'until curl -sf http://localhost:4443/storage/v1/b; do sleep 1; done'
          curl -sf -X POST http://localhost:4443/storage/v1/b \
            -H 'Content-Type: application/json' -d '{"name":"test-cache"}'

      - name: Start asset-proxy (processing mode)
        run: cd packages/proxy && nohup node --conditions source --import tsx --import ./src/instrument.ts src/index.ts > /tmp/asset-proxy.log 2>&1 &
        env:
          HEALTH_PORT: "8082"
          SKIP_GPU: "1"
          SOURCE_URL_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          SIGNING_KEY: "deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef"
          SIGNING_SALT: "cafebabecafebabecafebabecafebabecafebabecafebabecafebabecafebabe"
          ALLOWED_ORIGINS: "http://file-server"
          BEST_FORMAT_MAX_RESOLUTION: "0.005"
          STORAGE_EMULATOR_HOST: "http://localhost:4443"
          NODE_V8_COVERAGE: /tmp/coverage-asset-proxy
          OTEL_EXPORTER_OTLP_ENDPOINT: "http://localhost:4318"
          OTEL_TRACES_SAMPLER: "always_on"
          OTEL_BSP_SCHEDULE_DELAY: "100"

      - name: Wait for asset-proxy
        id: wait
        run: timeout 30 bash -c 'until curl -sf http://localhost:8082/health; do sleep 1; done'

      - name: Print asset-proxy startup logs
        if: failure() && steps.wait.outcome == 'failure'
        run: tail -100 /tmp/asset-proxy.log

      - name: Start cache-proxy
        run: cd packages/proxy && nohup node --conditions source --import tsx --import ./src/instrument.ts src/index.ts > /tmp/cache-proxy.log 2>&1 &
        env:
          HEALTH_PORT: "8083"
          PORT: "8081"
          FORWARD_URL: "http://localhost:8080"
          CACHE_BUCKET: "test-cache"
          GCS_API_ENDPOINT: "http://localhost:4443"
          NODE_V8_COVERAGE: /tmp/coverage-cache-proxy
          OTEL_EXPORTER_OTLP_ENDPOINT: "http://localhost:4318"
          OTEL_TRACES_SAMPLER: "always_on"
          OTEL_BSP_SCHEDULE_DELAY: "100"

      - name: Wait for cache-proxy
        id: wait-cache
        run: timeout 30 bash -c 'until curl -sf http://localhost:8083/health; do sleep 1; done'

      - name: Print cache-proxy startup logs
        if: failure() && steps.wait-cache.outcome == 'failure'
        run: tail -100 /tmp/cache-proxy.log

      - name: Run tests
        id: tests
        run: pnpm -w run test --coverage

      - name: Update snapshots
        if: failure() && steps.tests.outcome == 'failure'
        run: pnpm -w run test --update

      - name: Collect and merge coverage
        if: always() && steps.tests.outcome != 'skipped'
        run: |
          # Stop proxy processes so Node flushes NODE_V8_COVERAGE data
          kill $(lsof -ti :8080) $(lsof -ti :8081) 2>/dev/null || true
          sleep 2

          # Save vitest lcov before merge overwrites it
          mkdir -p .coverage-raw/server
          cp coverage/lcov.info .coverage-raw/vitest-lcov.info

          # Collect raw V8 coverage from both proxies
          cp /tmp/coverage-asset-proxy/*.json .coverage-raw/server/ 2>/dev/null || true
          cp /tmp/coverage-cache-proxy/*.json .coverage-raw/server/ 2>/dev/null || true

          # Convert server V8 data to lcov via c8 (server uses tsx with
          # --conditions source, so V8 data has src/ URLs)
          if compgen -G ".coverage-raw/server/*.json" > /dev/null; then
            pnpm exec c8 report \
              --src . \
              --include 'packages/*/src/**' \
              --exclude '**/__mocks__/**' \
              --temp-directory .coverage-raw/server \
              --reporter lcov --reports-dir .coverage-server-report
          fi

          # Merge vitest + server lcov (max count per line, regenerates HTML)
          node scripts/merge-coverage.mjs \
            .coverage-raw/vitest-lcov.info \
            .coverage-server-report/lcov.info

      - name: Check for snapshot changes
        if: always() && github.event_name == 'pull_request'
        id: snapshots
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create snapshot update PR
        if: always() && steps.snapshots.outputs.changed == 'true' && github.event_name == 'pull_request'
        id: snapshot-pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="snapshot-update/${{ github.head_ref || github.ref_name }}"
          BASE="${{ github.head_ref || github.ref_name }}"
          git fetch origin "$BRANCH" || true
          git checkout -B "$BRANCH"
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "test: update image snapshots"
          git lfs push --all origin "$BRANCH"
          git push --force-with-lease origin "$BRANCH"
          if ! gh pr view "$BRANCH" --json number &>/dev/null; then
            gh api repos/${{ github.repository }}/pulls \
              -f head="$BRANCH" \
              -f base="$BASE" \
              -f title="Update image snapshots" \
              -f body="Automated snapshot update from [${{ github.workflow }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}?pr=${{ github.event.pull_request.number }})
          Created from #${{ github.event.pull_request.number }}"
          fi
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Delete stale snapshot branch
        if: always() && !cancelled() && steps.snapshots.outputs.changed != 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="snapshot-update/${{ github.head_ref || github.ref_name }}"
          gh pr close "$BRANCH" --delete-branch 2>/dev/null || true

      - name: Fail if snapshots were outdated
        if: steps.snapshot-pr.outputs.created == 'true'
        run: exit 1

      - uses: codecov/codecov-action@v5
        if: always() && !cancelled() && steps.tests.outcome != 'skipped'
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Print asset-proxy logs
        if: failure() && steps.snapshots.outputs.changed != 'true'
        run: |
          echo "=== asset-proxy ==="
          cat /tmp/asset-proxy.log
          echo "=== cache-proxy ==="
          cat /tmp/cache-proxy.log

  docker-build:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/docker-build.yml
    with:
      push: false
    permissions:
      contents: read
      packages: write

  cd:
    if: github.event_name == 'push'
    needs: [test]
    uses: ./.github/workflows/docker-build.yml
    with:
      push: true
    permissions:
      contents: read
      packages: write

  required:
    if: always() && !cancelled()
    needs: [test, docker-build, cd]
    permissions: {}
    runs-on: warp-ubuntu-latest-x64-2x
    steps:
      - name: Check required jobs
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "test: ${{ needs.test.result }}"
            exit 1
          fi
          if [ "${{ needs.docker-build.result }}" != "success" ] && [ "${{ needs.docker-build.result }}" != "skipped" ]; then
            echo "docker-build: ${{ needs.docker-build.result }}"
            exit 1
          fi
          if [ "${{ needs.cd.result }}" != "success" ] && [ "${{ needs.cd.result }}" != "skipped" ]; then
            echo "cd: ${{ needs.cd.result }}"
            exit 1
          fi
