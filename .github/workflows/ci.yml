name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: warp-ubuntu-latest-x64-2x
    services:
      file-server:
        image: nginx:alpine
        ports:
          - 80:80
        volumes:
          - ${{ github.workspace }}/nginx:/usr/share/nginx
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          path: repo

      - name: Map file-server hostname
        run: echo "127.0.0.1 file-server" | sudo tee -a /etc/hosts

      - name: Link test fixtures into nginx
        run: sudo rm -rf nginx/html && sudo ln -s ${{ github.workspace }}/repo/tests/fixtures nginx/html

      - name: Verify file-server
        run: curl -sf http://file-server/test-image.png -o /dev/null

      - uses: actions/setup-node@v4
        with:
          node-version-file: repo/.tool-versions
          cache: yarn
          cache-dependency-path: repo/yarn.lock

      - run: yarn install --immutable
        working-directory: repo

      - run: yarn typecheck
        working-directory: repo

      - run: yarn lint
        working-directory: repo

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Start asset-proxy
        run: nohup npx tsx src/index.ts > /tmp/asset-proxy.log 2>&1 &
        working-directory: repo
        env:
          SKIP_GPU: "1"
          SOURCE_URL_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          ALLOWED_ORIGINS: "http://file-server"

      - name: Wait for asset-proxy
        run: timeout 30 bash -c 'until curl -sf http://localhost:8080/health; do sleep 1; done'

      - run: yarn test
        working-directory: repo

      - name: Print asset-proxy logs
        if: failure()
        run: cat /tmp/asset-proxy.log
