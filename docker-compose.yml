services:
  asset-proxy:
    build: .
    environment:
      - SKIP_GPU=1
      - SOURCE_URL_ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      - ALLOWED_ORIGINS=http://file-server
    ports:
      - "8080:8080"
    volumes:
      - ./src:/app/src:ro
      - ./package.json:/app/package.json:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
    command: ["npx", "tsx", "--watch", "src/index.ts"]
    depends_on:
      - file-server

  file-server:
    image: nginx:alpine
    volumes:
      - ./tests/fixtures:/usr/share/nginx/html:ro
