services:
  asset-proxy:
    build: .
    init: true
    environment:
      - HEALTH_PORT=8082
      - NODE_V8_COVERAGE
      - SKIP_GPU=1
      - SOURCE_URL_ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      - SIGNING_KEY=deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef
      - SIGNING_SALT=cafebabecafebabecafebabecafebabecafebabecafebabecafebabecafebabe
      - ALLOWED_ORIGINS=http://file-server
      - BEST_FORMAT_MAX_RESOLUTION=0.005
      - STORAGE_EMULATOR_HOST=http://fake-gcs:4443
    ports:
      - "8080:8080"
      - "8082:8082"
    volumes:
      - ./packages/proxy/src:/app/packages/proxy/src:ro
      - ./packages/proxy/dist:/app/packages/proxy/dist:ro
      - ./packages/url-parser/src:/app/packages/url-parser/src:ro
      - ./packages/url-parser/dist:/app/packages/url-parser/dist:ro
      - ./packages/proxy/package.json:/app/packages/proxy/package.json:ro
      - ./packages/url-parser/package.json:/app/packages/url-parser/package.json:ro
      - ./package.json:/app/package.json:ro
      - ./.coverage-docker/asset-proxy:/coverage
    command:
      - sh
      - -c
      - |
        if [ -n "$$NODE_V8_COVERAGE" ]; then
          exec node packages/proxy/dist/index.js
        else
          exec pnpm --filter proxy exec tsx --watch src/index.ts
        fi
    depends_on:
      - file-server
      - fake-gcs

  cache-proxy:
    build: .
    init: true
    environment:
      - HEALTH_PORT=8082
      - NODE_V8_COVERAGE
      - FORWARD_URL=http://asset-proxy:8080
      - CACHE_BUCKET=test-cache
      - GCS_API_ENDPOINT=http://fake-gcs:4443
    ports:
      - "8081:8080"
      - "8083:8082"
    volumes:
      - ./packages/proxy/src:/app/packages/proxy/src:ro
      - ./packages/proxy/dist:/app/packages/proxy/dist:ro
      - ./packages/url-parser/src:/app/packages/url-parser/src:ro
      - ./packages/url-parser/dist:/app/packages/url-parser/dist:ro
      - ./packages/proxy/package.json:/app/packages/proxy/package.json:ro
      - ./packages/url-parser/package.json:/app/packages/url-parser/package.json:ro
      - ./package.json:/app/package.json:ro
      - ./.coverage-docker/cache-proxy:/coverage
    command:
      - sh
      - -c
      - |
        if [ -n "$$NODE_V8_COVERAGE" ]; then
          exec node packages/proxy/dist/index.js
        else
          exec pnpm --filter proxy exec tsx --watch src/index.ts
        fi
    depends_on:
      - asset-proxy
      - fake-gcs

  fake-gcs:
    image: fsouza/fake-gcs-server
    command: ["-scheme", "http", "-port", "4443", "-data", "/data"]
    volumes:
      - ./packages/proxy/tests/fixtures/fake-gcs:/data:ro
    ports:
      - "4443:4443"

  file-server:
    image: nginx:alpine
    volumes:
      - ./packages/proxy/tests/fixtures:/usr/share/nginx/html:ro
